<!DOCTYPE html>
<html>
<head>
<title>Juice Favor Slot</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🍊 Juice Favor</h1>

<div class="panel">
    Credits:
    <span id="credits">1000</span>
</div>

<div class="panel">
    Bet:
    <button onclick="changeBet(-10)">-</button>
    <span id="bet">20</span>
    <button onclick="changeBet(10)">+</button>
</div>


<div id="slot"></div>


<button id="spin">
SPIN
</button>


<div id="message"></div>


<script src="game.js"></script>

</body>
</html>
